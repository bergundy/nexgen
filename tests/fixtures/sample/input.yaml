# yaml-language-server: $schema=../../../input.schema.json

nexusrpc: 1.0.0

support:
  $pythonFile: python/model_overrides.py
  $typescriptFile: typescript/model_overrides.ts

types:
  temporal.api.common.v1.RetryPolicy:
    $python:
      type: temporalio.common.RetryPolicy
    $typescript:
      type: common.RetryPolicy
  temporal.api.common.v1.WorkflowType:
    $python:
      type: str | collections.abc.Callable[..., collections.abc.Awaitable[typing.Any]]
  temporal.api.taskqueue.v1.TaskQueue:
    $python:
      type: str
  temporal.api.common.v1.Payload:
    $python:
      type: typing.Any
  temporal.api.common.v1.Payloads:
    $python:
      type: collections.abc.Sequence[typing.Any]
  temporal.api.common.v1.Memo:
    $python:
      type: collections.abc.Mapping[str, typing.Any]
  temporal.api.common.v1.SearchAttributes:
    $python:
      type: temporalio.common.TypedSearchAttributes | temporalio.common.SearchAttributes
  temporal.api.common.v1.Priority:
    $python:
      type: temporalio.common.Priority
  temporal.api.workflow.v1.VersioningOverride:
    $python:
      type: temporalio.common.VersioningOverride
  google.protobuf.Duration:
    $python:
      type: timedelta
  temporal.api.workflowservice.v1.SignalWithStartWorkflowExecutionRequest:
    required:
      - workflow_type
      - workflow_id
      - task_queue
      - signal_name
    omit:
      - header
      - links
  temporal.api.activity.v1.ActivityOptions:
    required:
      - retry_policy
  temporal.api.enums.v1.WorkflowIdReusePolicy:
    $python:
      type: temporalio.common.WorkflowIDReusePolicy
  temporal.api.enums.v1.WorkflowIdConflictPolicy:
    $python:
      type: temporalio.common.WorkflowIDConflictPolicy

services:
  WorkflowService:
    endpoint: __temporal_system
    operations:
      SignalWithStartWorkflowExecution:
        input:
          $pythonRef: temporalio.api.workflowservice.v1.SignalWithStartWorkflowExecutionRequest
          $typescriptRef: "@temporalio/api/workflowservice/v1.SignalWithStartWorkflowExecutionRequest"
        output:
          $pythonRef: temporalio.api.workflowservice.v1.SignalWithStartWorkflowExecutionResponse
          $typescriptRef: "@temporalio/api/workflowservice/v1.SignalWithStartWorkflowExecutionResponse"
      RetryPolicyOperation:
        input:
          $pythonRef: temporalio.api.common.v1.RetryPolicy
          $typescriptRef: "@temporalio/api/common/v1.RetryPolicy"
        output:
          $pythonRef: temporalio.api.common.v1.RetryPolicy
          $typescriptRef: "@temporalio/api/common/v1.RetryPolicy"
      ActivityOptionsOperation:
        input:
          $pythonRef: temporalio.api.activity.v1.ActivityOptions
          $typescriptRef: "@temporalio/api/activity/v1.ActivityOptions"
        output:
          $pythonRef: temporalio.api.activity.v1.ActivityOptions
          $typescriptRef: "@temporalio/api/activity/v1.ActivityOptions"
