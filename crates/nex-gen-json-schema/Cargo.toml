[package]
name = "nex-gen-json-schema"
version = "0.1.0"
edition = "2024"
description = "Generate idiomatic, statically-typed models and validators for Go, Java, Python, and TypeScript from JSON Schema 2020-12, plus Nexus service bindings."
license = "MIT"
repository = "https://github.com/temporalio/nex-gen"

[[bin]]
name = "nex-gen-json-schema"
path = "src/main.rs"

[lib]
name = "nex_gen_json_schema"
path = "src/lib.rs"

[dependencies]
nex-gen-core = { path = "../nex-gen-core" }
clap = { version = "4.5", features = ["derive"] }
heck = "0.5"
indexmap = { version = "2.7", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"
