# yaml-language-server: $schema=../input.schema.json

nexusrpc: 1.0.0

support:
  $python: python-validation/model_overrides.py
  $typescript: typescript-validation/model_overrides.ts

types:
  temporal.api.common.v1.RetryPolicy:
    $python:
      type: temporalio.common.RetryPolicy
    $typescript:
      type: common.RetryPolicy
  temporal.api.common.v1.WorkflowType:
    $python:
      type: str | collections.abc.Callable[..., collections.abc.Awaitable[typing.Any]]
  temporal.api.taskqueue.v1.TaskQueue:
    $python:
      type: str
  temporal.api.common.v1.Payload:
    $python:
      type: typing.Any
  temporal.api.common.v1.Payloads:
    $python:
      type: collections.abc.Sequence[typing.Any]
  temporal.api.common.v1.Memo:
    $python:
      type: collections.abc.Mapping[str, typing.Any]
  temporal.api.common.v1.SearchAttributes:
    $python:
      type: temporalio.common.TypedSearchAttributes | temporalio.common.SearchAttributes
  temporal.api.common.v1.Priority:
    $python:
      type: temporalio.common.Priority
  temporal.api.workflow.v1.VersioningOverride:
    $python:
      type: temporalio.common.VersioningOverride
  google.protobuf.Duration:
    $python:
      type: timedelta
  temporal.api.workflowservice.v1.SignalWithStartWorkflowExecutionRequest:
    required:
      - workflow_type
      - workflow_id
      - task_queue
      - signal_name
    omit:
      - header
      - links
    fields:
      workflow_type:
        name: workflow
      signal_name:
        name: signal
    $python:
      fields:
        namespace:
          source: workflow.info().namespace
        workflow_type:
          function:
            primary: true
            result: collections.abc.Awaitable[typing.Any]
            argsField: input
        signal_name:
          function:
            result: None | collections.abc.Awaitable[None]
            argsField: signal_input
    $typescript:
      fields:
        namespace:
          source: workflow.workflowInfo().namespace
  temporal.api.activity.v1.ActivityOptions:
    required:
      - retry_policy
  temporal.api.enums.v1.WorkflowIdReusePolicy:
    $python:
      type: temporalio.common.WorkflowIDReusePolicy
  temporal.api.enums.v1.WorkflowIdConflictPolicy:
    $python:
      type: temporalio.common.WorkflowIDConflictPolicy

services:
  WorkflowService:
    endpoint: __temporal_system
    operations:
      SignalWithStartWorkflowExecution:
        input:
          $python: temporalio.api.workflowservice.v1.SignalWithStartWorkflowExecutionRequest
          $typescript: "@temporalio/api/workflowservice/v1.SignalWithStartWorkflowExecutionRequest"
        output:
          $python:
            ref: temporalio.api.workflowservice.v1.SignalWithStartWorkflowExecutionResponse
            type: workflow.ExternalWorkflowHandle[typing.Any]
            transform: workflow.get_external_workflow_handle(request.workflow_id, run_id=result.run_id)
          $typescript:
            ref: "@temporalio/api/workflowservice/v1.SignalWithStartWorkflowExecutionResponse"
            type: workflow.ExternalWorkflowHandle
            transform: workflow.getExternalWorkflowHandle(request.workflowId, result.runId ?? undefined)
      RetryPolicyOperation:
        input:
          $python: temporalio.api.common.v1.RetryPolicy
          $typescript: "@temporalio/api/common/v1.RetryPolicy"
        output:
          ref:
            $python: temporalio.api.common.v1.RetryPolicy
            $typescript: "@temporalio/api/common/v1.RetryPolicy"
      ActivityOptionsOperation:
        input:
          $python: temporalio.api.activity.v1.ActivityOptions
          $typescript: "@temporalio/api/activity/v1.ActivityOptions"
        output:
          ref:
            $python: temporalio.api.activity.v1.ActivityOptions
            $typescript: "@temporalio/api/activity/v1.ActivityOptions"
